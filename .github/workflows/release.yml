name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/mutant-cafe/package.json', 'utf8')).version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mutant-cafe build
      - run: node scripts/pack-smoke.mjs
      # This fork can't publish mutant-cafe to npm, so it attaches the tested
      # tarball to a GitHub release, which Bedrock installs by URL.
      - name: Attach the tested tarball to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "./dist/mutant-cafe-${RELEASE_VERSION}.tgz" \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --verify-tag \
            --notes "Install with \`\"mutant-cafe\": \"https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/mutant-cafe-${RELEASE_VERSION}.tgz\"\`."
