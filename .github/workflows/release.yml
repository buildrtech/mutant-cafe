name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.3.0
          run_install: false
      # npm trusted publishing requires CLI >=11.5.1.
      - run: npm install --global npm@11.16.0
      - name: Check tag matches package version
        run: |
          VERSION=$(node -p "JSON.parse(require('node:fs').readFileSync('packages/mutant-cafe/package.json', 'utf8')).version")
          test "$GITHUB_REF_NAME" = "v$VERSION"
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter mutant-cafe build
      - run: node scripts/pack-smoke.mjs
      # Stage only: a maintainer approves the staged version with 2FA. OIDC cannot approve.
      - name: Stage the tested tarball with OIDC
        run: |
          if npm view "mutant-cafe@${RELEASE_VERSION}" version >/dev/null 2>&1; then
            echo "mutant-cafe@${RELEASE_VERSION} is already published; nothing to stage."
            exit 0
          fi
          npm stage publish "./dist/mutant-cafe-${RELEASE_VERSION}.tgz" --provenance --access public
